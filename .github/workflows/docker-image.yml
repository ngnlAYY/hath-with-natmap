name: Docker Image CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Run Go tests
        run: go test ./...

      - name: Run Go vet
        run: go vet ./...

  docker:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: go
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify Go modules
        run: go mod verify

      - name: Run Go tests
        run: go test ./...

      - name: Run race tests
        run: go test -race ./...

      - name: Run coverage tests
        run: go test -coverpkg=./... ./tests/...

      - name: Run go vet
        run: go vet ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: $(go env GOPATH)/bin/govulncheck ./...

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to DockerHub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image for smoke test
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: deploy/docker/Dockerfile
          load: true
          platforms: linux/amd64
          tags: hath-with-natter:smoke

      - name: Smoke test image
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: |
          set +e
          help_output="$(docker run --rm hath-with-natter:smoke --help 2>&1)"
          help_status="$?"
          set -e
          test "$help_status" -eq 1
          printf '%s\n' "$help_output" | grep -q "Usage of hath-natmap"
          docker run --rm --entrypoint /bin/sh hath-with-natter:smoke -c 'test -x /usr/local/bin/natmap && test -x /usr/local/bin/hath-rust && test "$(id -u):$(id -g)" = "1000:1000"'

      - name: Build and push release image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: taskmgr818/hath-with-natter:latest
