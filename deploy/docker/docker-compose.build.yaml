# Docker Compose 示例：从本地源码构建 hath:natmap-rust 镜像并运行。
#
# 使用方式（在仓库根目录执行）：
#   cp configs/config.example.yaml config.yaml
#   docker compose -f deploy/docker/docker-compose.build.yaml up -d --build
#
# 如果已经有构建好的 hath:natmap-rust 镜像，请使用 deploy/docker/docker-compose.yaml。

name: natmap-rust

services:
  natmap-rust:
    image: hath:natmap-rust
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    container_name: natmap-rust
    network_mode: host
    restart: unless-stopped

    # 如果 config.yaml 中启用了 bandwidth.enabled: true，请取消下面两行注释。
    # cap_add:
    #   - NET_ADMIN

    volumes:
      # 主配置文件；请先从 configs/config.example.yaml 复制并填入真实账号信息。
      - ../../config.yaml:/config/config.yaml:ro
      # hath-rust 数据目录；请在仓库根目录提前执行 chown -R 1000:1000 hath。
      - ../../hath:/data/hath

    tmpfs:
      - /run/hath-natmap:uid=1000,gid=1000,mode=700

    user: "1000:1000"

    environment:
      # 容器时区；可按需要改为其它 IANA 时区名称。
      TZ: Asia/Shanghai
